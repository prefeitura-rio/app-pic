apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prefeitura-rio
spec:
  type: oci
  interval: 10m
  url: oci://ghcr.io/prefeitura-rio/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-pic-api-prod
spec:
  interval: 10m
  releaseName: app-pic-api-prod
  chart:
    spec:
      chart: base-chart
      version: 2.4.18
      sourceRef:
        kind: HelmRepository
        name: prefeitura-rio
  values:
    fullnameOverride: app-pic-api-prod
    image:
      repository: ghcr.io/prefeitura-rio/app-pic-api
      tag: prod-253 # {"$imagepolicy": "app-pic:app-pic-api-prod:tag"}
      pullPolicy: Always
    service:
      port: 80
      containerPort: 8089
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 20
    resources:
      requests:
        cpu: 250m
        memory: 4Gi
      limits:
        cpu: 1000m
        memory: 6Gi
    envFrom:
    - secretRef:
        name: api-secrets
    env:
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: api-secrets
          key: REDIS_PASSWORD
    - name: REDIS_URL
      value: redis://default:$(REDIS_PASSWORD)@app-pic-api-prod-valkey:6379/0
    autoscaling:
      enabled: false
    replicaCount: 1
    istio:
      enabled: false
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    valkey:
      enabled: true
      architecture: standalone
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi
      configuration: 'maxmemory 384mb

        maxmemory-policy allkeys-lru

'
      persistence:
        enabled: true
        size: 1Gi
      auth:
        enabled: true
        existingSecret: api-secrets
        existingSecretPasswordKey: REDIS_PASSWORD
    infisical:
      instance: secrets
    infisicalStaticSecret:
      enabled: true
      secretName: api-secrets
      projectSlug: app-pic
      envSlug: prod
    flux:
      policy:
        semver: null
        numerical:
          order: asc
      filterTags:
        pattern: ^prod-(?P<n>[0-9]+)$
        extract: $n
      imageUpdateOverwrite:
        git:
          branch: main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-pic-frontend-prod
spec:
  interval: 10m
  releaseName: app-pic-frontend-prod
  chart:
    spec:
      chart: base-chart
      version: 2.4.18
      sourceRef:
        kind: HelmRepository
        name: prefeitura-rio
  values:
    fullnameOverride: app-pic-frontend-prod
    image:
      repository: ghcr.io/prefeitura-rio/app-pic-frontend
      tag: prod-203 # {"$imagepolicy": "app-pic:app-pic-frontend-prod:tag"}
      pullPolicy: Always
    service:
      port: 80
      containerPort: 3000
    livenessProbe:
      tcpSocket:
        port: http
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      tcpSocket:
        port: http
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      tcpSocket:
        port: http
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 20
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 4Gi
    envFrom:
    - secretRef:
        name: frontend-secrets
    autoscaling:
      enabled: false
    replicaCount: 1
    istio:
      enabled: true
      virtualService:
        hosts:
        - pequenoscariocas.dados.rio
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    ingress:
      enabled: false
    infisical:
      instance: secrets
    infisicalStaticSecret:
      enabled: true
      secretName: frontend-secrets
      projectSlug: app-pic
      envSlug: prod
    flux:
      policy:
        semver: null
        numerical:
          order: asc
      filterTags:
        pattern: ^prod-(?P<n>[0-9]+)$
        extract: $n
      imageUpdateOverwrite:
        git:
          branch: main
