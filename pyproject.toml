[project]
name = "app-pic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.123.0",
  "google-auth>=2.43.0",
  "google-cloud-bigquery>=3.38.0",
  "google-cloud-bigquery-storage>=2.34.0",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "numpy>=2.3.5",
  "pandas>=2.3.3",
  "python-dotenv>=1.2.1",
  "uvicorn>=0.38.0",
  "python-jose[cryptography]>=3.3.0",
  "pyjwt[crypto]>=2.10.1",
  "db-dtypes>=1.4.4",
  "redis>=7.1.0",
  "polars>=1.35.2",
  "openpyxl>=3.1.0",
  "python-multipart>=0.0.9",
  "postgrest==2.31.0",
]

[dependency-groups]
dev = ["ruff>=0.8.4", "pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["src/pic"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long, handled by formatter
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
